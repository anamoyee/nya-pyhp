[project]
name = 'nya-pyhp'
dynamic = ['version']
description = 'PHP-like file value interpolator but with python and arbitrary file types not just html'
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arguably",
]

[project.scripts]
pyhp = "pyhp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pyhp/_version.py"
pattern = '__version__(?:: str)? *= *\"(?P<version>[^\"]+)\"'

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "tcrutils>=13.1.39",
]
